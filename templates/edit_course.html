{% extends "base.html" %}

{% block title %}Edit Course - Class Record App{% endblock %}

{% block content %}
<div class="container">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="{{ url_for('course_detail', course_id=course.id) }}">{{ course.course_title }}</a></li>
            <li class="breadcrumb-item active" aria-current="page">Edit Course</li>
        </ol>
    </nav>

    <!-- Header -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"><i class="bi bi-pencil"></i> Edit Course</h4>
        </div>
        <div class="card-body">
            <form method="POST" action="">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Course Code <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="course_code" 
                               value="{{ course.course_code }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Course Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="course_title" 
                               value="{{ course.course_title }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Offering Number</label>
                        <input type="text" class="form-control" name="offering_number" 
                               value="{{ course.offering_number }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Schedule</label>
                        <input type="text" class="form-control" name="schedule" 
                               value="{{ course.schedule }}" placeholder="e.g., 8:00-9:00 AM">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Days</label>
                        <input type="text" class="form-control" name="days" 
                               value="{{ course.days }}" placeholder="e.g., MWF">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Room</label>
                        <input type="text" class="form-control" name="room" 
                               value="{{ course.room }}" placeholder="e.g., CH504">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="3" placeholder="Course description...">
{{ course.description }}
                        </textarea>
                    </div>
                </div>
                <hr>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Save Changes
                    </button>
                    <a href="{{ url_for('course_detail', course_id=course.id) }}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
