{% extends "base.html" %}

{% block title %}Edit Course - HCDC Class Record{% endblock %}

{% block content %}
<div style="margin-bottom: 16px;">
    <a href="{{ url_for('course_detail', course_id=course.id) }}" class="course-btn" style="display: inline-flex; align-items: center; gap: 6px;">
        <i class="bi bi-arrow-left"></i> Back to Course
    </a>
</div>

<div class="card">
    <h1 style="margin: 0 0 8px 0;">Edit Course</h1>
    <p class="subtitle">Update {{ course.course_title }} details</p>
    
    <form method="POST" action="{{ url_for('edit_course', course_id=course.id) }}" style="margin-top: 20px;">
        <div class="form-row">
            <div class="form-group">
                <label for="course_code">Course Code <span style="color: var(--hcdc-secondary);">*</span></label>
                <input type="text" id="course_code" name="course_code" value="{{ course.course_code }}" required>
            </div>
            <div class="form-group">
                <label for="course_title">Course Title <span style="color: var(--hcdc-secondary);">*</span></label>
                <input type="text" id="course_title" name="course_title" value="{{ course.course_title }}" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="offering_number">Offering Number</label>
                <input type="text" id="offering_number" name="offering_number" value="{{ course.offering_number }}">
            </div>
            <div class="form-group">
                <label for="schedule">Schedule</label>
                <input type="text" id="schedule" name="schedule" value="{{ course.schedule }}">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="room">Room</label>
                <input type="text" id="room" name="room" value="{{ course.room }}">
            </div>
            <div class="form-group">
                <label for="days">Days</label>
                <input type="text" id="days" name="days" value="{{ course.days }}">
            </div>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ course.description }}</textarea>
        </div>
        
        <div class="actions" style="margin-top: 24px;">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check"></i> Save Changes
            </button>
            <a href="{{ url_for('course_detail', course_id=course.id) }}" class="btn btn-secondary">
                <i class="bi bi-x"></i> Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
