{% extends "base.html" %}

{% block title %}Add Course - HCDC Class Record{% endblock %}

{% block content %}
<div style="margin-bottom: 16px;">
    <a href="{{ url_for('dashboard') }}" class="course-btn" style="display: inline-flex; align-items: center; gap: 6px;">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
</div>

<div class="card">
    <h1 style="margin: 0 0 8px 0;">Add New Course</h1>
    <p class="subtitle">Enter the course details below</p>
    
    <form method="POST" action="{{ url_for('add_course') }}" style="margin-top: 20px;">
        <div class="form-row">
            <div class="form-group">
                <label for="course_code">Course Code <span style="color: var(--hcdc-secondary);">*</span></label>
                <input type="text" id="course_code" name="course_code" placeholder="e.g., CET-101" required>
            </div>
            <div class="form-group">
                <label for="course_title">Course Title <span style="color: var(--hcdc-secondary);">*</span></label>
                <input type="text" id="course_title" name="course_title" placeholder="e.g., Computer Fundamentals" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="offering_number">Offering Number</label>
                <input type="text" id="offering_number" name="offering_number" placeholder="e.g., 1" value="1">
            </div>
            <div class="form-group">
                <label for="schedule">Schedule</label>
                <input type="text" id="schedule" name="schedule" placeholder="e.g., 8:00-10:00 AM">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="room">Room</label>
                <input type="text" id="room" name="room" placeholder="e.g., CET-201">
            </div>
            <div class="form-group">
                <label for="days">Days</label>
                <input type="text" id="days" name="days" placeholder="e.g., MWF">
            </div>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" placeholder="Course description..."></textarea>
        </div>
        
        <div class="actions" style="margin-top: 24px;">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check"></i> Add Course
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                <i class="bi bi-x"></i> Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
