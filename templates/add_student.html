{% extends "base.html" %}

{% block title %}Add Student - {{ course.course_code }} - HCDC Class Record{% endblock %}

{% block content %}
<div style="margin-bottom: 16px;">
    <a href="{{ url_for('course_detail', course_id=course.id) }}" class="course-btn" style="display: inline-flex; align-items: center; gap: 6px;">
        <i class="bi bi-arrow-left"></i> Back to Course
    </a>
</div>

<div class="card">
    <div class="section-header">
        <h1 style="margin: 0;">Add Student to {{ course.course_code }}</h1>
    </div>
    
    <p class="subtitle">Add a new student to this course</p>
    
    <form method="POST" action="{{ url_for('add_student', course_id=course.id) }}">
        <div style="display: grid; gap: 16px; max-width: 500px;">
            <div class="form-group">
                <label for="last_name">Last Name *</label>
                <input type="text" id="last_name" name="last_name" class="form-control" 
                       style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;"
                       required autofocus>
            </div>
            
            <div class="form-group">
                <label for="first_name">First Name *</label>
                <input type="text" id="first_name" name="first_name" class="form-control"
                       style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;"
                       required>
            </div>
            
            <div class="form-group">
                <label for="id_number">ID Number</label>
                <input type="text" id="id_number" name="id_number" class="form-control"
                       style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;"
                       placeholder="8-digit HCDC ID Number">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control"
                       style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;"
                       placeholder="student@hcdc.edu.ph">
            </div>
            
            <div class="form-group">
                <label for="status">Enrollment Status</label>
                <select id="status" name="status" class="form-control"
                        style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;">
                    <option value="Active" selected>Active</option>
                    <option value="Dropped">Dropped</option>
                </select>
            </div>
        </div>
        
        <div class="actions" style="margin-top: 24px;">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-person-plus"></i> Add Student
            </button>
            <a href="{{ url_for('course_detail', course_id=course.id) }}" class="btn btn-secondary">
                <i class="bi bi-x"></i> Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
